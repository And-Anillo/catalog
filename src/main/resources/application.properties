spring.application.name=catalog

# TASK 1: Spring Data JPA + H2 Setup
spring.datasource.url=jdbc:h2:mem:eventcatalogdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create/update the schema on startup (great for H2/development)
spring.jpa.hibernate.ddl-auto=update 

# Show the SQL in the console (useful for juniors to learn JPA)
spring.jpa.show-sql=true

# Enable H2 Console for inspection (optional, but helpful)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console